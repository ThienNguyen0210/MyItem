actions:
  - type: DAMAGE
    target: VICTIM
    amount: 8
    damage-type: TRUE
    children:
      - type: HEAL
        target: SELF
        percent: 5
        children:
          - type: BUFF_STAT
            target: SELF
            stat: movement_speed
            amount: 10
            duration-seconds: 4
