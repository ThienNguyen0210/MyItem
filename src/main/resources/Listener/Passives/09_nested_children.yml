# ─────────────────────────────────────────────────────────────────
# MẪU 9: Cha-con nhiều cấp (đệ quy)
# DAMAGE -> nếu thành công -> HEAL (con cấp 1) -> nếu HEAL thành công
# (chưa full máu) -> BUFF_STAT (con cấp 2, "ăn mừng" sau khi heal được).
# Minh hoạ children có thể lồng nhiều tầng, không chỉ 1 cấp.
# ─────────────────────────────────────────────────────────────────
id: berserker_combo
display-name: "§c[Cuồng Chiến]"
trigger: ON_HIT
