# =====================================================================
#  GemStone/type.yml
#  The SOCKETING file — one section per socket RARITY (e.g. common, rare,
#  legendary). Each rarity defines:
#    - format         : lore line shown for an EMPTY socket of this rarity
#    - limit          : max sockets of THIS rarity allowed on one item
#    - drills         : the DRILL items that create an empty socket of
#                        this rarity (given via /mi gemstone give drill ...)
#
#  "general" is a special top-level section (skipped when resolving a
#  drill's rarity) that holds settings shared across every rarity.
# =====================================================================

general:
  # Total socket cap on a single item, regardless of rarity mix.
  max-sockets: 4

common:
  format: "&7[ ○ ] Lỗ Trống"      # empty-socket lore line for this rarity
  limit: 4                        # max "common" sockets on one item
  drills:
    DRILL_COMMON:
      display-name: "&f[ Khoan ] Cơ Bản"
      material: IRON_PICKAXE
      model-id: 300001
      cost: 100                   # money withdrawn on use (Vault); 0 = free
      success: 100                # % chance the drilling succeeds
      lore:
        - "&7Đục 1 lỗ trống loại thường."

rare:
  format: "&9[ ○ ] Lỗ Trống"
  limit: 2
  drills:
    DRILL_RARE:
      display-name: "&9[ Khoan ] Hiếm"
      material: DIAMOND_PICKAXE
      model-id: 300002
      cost: 500
      success: 80
      lore:
        - "&7Đục 1 lỗ trống loại hiếm."

legendary:
  format: "&6[ ○ ] Lỗ Trống"
  limit: 1
  drills:
    DRILL_LEGENDARY:
      display-name: "&6[ Khoan ] Huyền Thoại"
      material: NETHERITE_PICKAXE
      model-id: 300003
      cost: 2000
      success: 50
      lore:
        - "&7Đục 1 lỗ trống loại huyền thoại."
